server:
  port: ${PORT:8080}

spring:
  application:
    name: fbguard-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fbguard?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # generates/updates tables from the @Entity classes above
    show-sql: false
    defer-datasource-initialization: true # let Hibernate create tables BEFORE data.sql runs
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always # run data.sql on every startup (each INSERT is idempotent, see data.sql)

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # If you don't want to run Kafka locally while developing, set
    # KAFKA_ENABLED=false and the app degrades gracefully (see AppEventProducer).

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
    email: ${ADMIN_EMAIL:admin@fbguard.local}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false} # flip to true once MAIL_USERNAME/MAIL_PASSWORD are set

verification:
  safe-browsing:
    api-key: ${SAFE_BROWSING_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
